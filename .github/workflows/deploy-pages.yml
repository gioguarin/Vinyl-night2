name: Deploy static demo to GitHub Pages

# Pages is configured as "Deploy from a branch": main /docs. This workflow
# builds the static demo and commits the output to docs/ on main.
on:
  push:
    branches: [main, claude/new-session-j0mvol]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: scripts/build-demo.sh
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
      - name: Commit demo to main:/docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git worktree add ../pages-publish origin/main
          cd ../pages-publish
          git checkout -B main origin/main
          rm -rf docs
          cp -a "$GITHUB_WORKSPACE/.demo-build/out" docs
          git add -A docs
          if git diff --cached --quiet; then
            echo "Demo unchanged; nothing to publish."
          else
            git commit -m "Publish static demo to docs/ [skip ci]"
            git push origin main
          fi
